server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    # Relative redirects: nginx's own `/dir` -> `/dir/` redirect otherwise names its internal port 80,
    # which drops the published port — and breaks the ChatGPT sign-in callback at /auth/callback.
    absolute_redirect off;

    # The ChatGPT plan's API calls (packages/ai/src/chatgptAuth.ts `chatGPTApiBase`): api.openai.com
    # sends no CORS headers for a ChatGPT-token request, so the page reaches it through this origin.
    # Mirrors the dev server proxy in rspack.config.ts.
    location /openai/ {
        proxy_pass https://api.openai.com/;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_set_header Cookie "";
        # Stream the reply as it is written, and allow the long turns of a reasoning model.
        proxy_buffering off;
        proxy_read_timeout 600s;
        # Requests carry the conversation's images inline.
        client_max_body_size 64m;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
